  permissions.shell: {channel: sandbox, status: ENFORCEABLE}
  permissions.web_access: {channel: sandbox, status: ENFORCEABLE}
  review.human_required_for: {channel: instruction, status: GUIDANCE_ONLY}
  testing.tdd: {channel: instruction, status: GUIDANCE_ONLY}
  developer.plan_before_code: {channel: instruction, status: GUIDANCE_ONLY}

tcb_notice:
  - ".aeh/runtime/core/**"
  - ".aeh/runtime/schemas/**"
  - ".aeh/manifest.yaml"
  - ".aeh/profile.yaml"
  - ".aeh/effective-workflow.yaml"
